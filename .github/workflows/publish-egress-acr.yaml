# Test + build the egress image and push it to Azure Container Registry (ACR).
#
# Bigly-Sales internal CI for egress. Runs Go unit tests, then builds
# ./build/egress/Dockerfile. On pull requests it builds without pushing (validation);
# on workflow_dispatch and version tags it pushes to our ACR.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   ACR_USERNAME, ACR_PASSWORD - ACR push credentials (admin user or SP/token).
# Optional repo variables:
#   ACR_LOGIN_SERVER  (default: acrsharedsouthcentralusbiglysales.azurecr.io)
#   EGRESS_IMAGE_NAME (default: livekit-egress)
#   DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN - optional, only to avoid Docker Hub
#     anonymous pull-rate limits when fetching the livekit/* base images.
#
# NOTE: workflow_dispatch runs the copy of this file on the selected branch, so the branch
# you build must contain this workflow file.

name: Publish Egress (ACR)

on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra image tag (e.g. canary)"
        required: false
        type: string
  pull_request:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-egress-acr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER || 'acrsharedsouthcentralusbiglysales.azurecr.io' }}
  IMAGE_NAME: ${{ vars.EGRESS_IMAGE_NAME || 'livekit-egress' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ~/.cache/go-build
          key: "${{ runner.os }}-egress-test-${{ hashFiles('**/go.sum') }}"
          restore-keys: ${{ runner.os }}-egress-test

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2

      # The pulse/stats packages are cgo and link against GStreamer, so the dev headers
      # must be present to compile and run the unit tests.
      - name: Install GStreamer dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      # Scoped to packages that are unit-testable on a bare runner. The muxer / sink
      # tests need the full GStreamer plugin set + cloud upload credentials and only run
      # inside the egress runtime image (see the Integration Test workflow).
      - name: Go unit tests
        run: go test ./pkg/stats/... ./pkg/config/... ./pkg/pipeline/source/pulse/...

  docker:
    needs: test
    runs-on: ubuntu-latest   # switch to a larger runner label if the build is too slow/OOMs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ~/.cache
          key: "${{ runner.os }}-egress-${{ hashFiles('**/go.sum') }}"
          restore-keys: ${{ runner.os }}-egress

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2

      - name: Download Go modules
        run: go mod download

      - name: Get template image tag
        id: template-tag
        run: echo "template_tag=$(go run github.com/livekit/egress/cmd/template_version)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker-md
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Optional: authenticate base-image pulls to dodge Docker Hub rate limits.
      - name: Login to Docker Hub (optional)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push only on dispatch / tags. Pull requests build for validation without pushing.
      - name: Login to ACR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/egress/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64   # AKS nodepools are amd64; add linux/arm64 only if needed
          tags: ${{ steps.docker-md.outputs.tags }}
          labels: ${{ steps.docker-md.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TEMPLATE_TAG=${{ steps.template-tag.outputs.template_tag }}
